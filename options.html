<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube HD Settings</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 20px;
    max-width: 420px;
  }
  h1 {
    font-size: 16px;
    margin-bottom: 4px;
  }
  p.desc {
    font-size: 12px;
    color: #555;
    margin-top: 0;
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
  }
  select {
    font-size: 14px;
    padding: 6px 8px;
    width: 100%;
    box-sizing: border-box;
  }
  #status {
    margin-top: 12px;
    font-size: 12px;
    color: #2e7d32;
    min-height: 14px;
  }
</style>
</head>
<body>
  <h1>YouTube HD</h1>
  <p class="desc">
    Choose the target video quality. YouTube HD will select this quality
    automatically, or the highest quality available below it if the target
    isn't offered for a given video.
  </p>

  <label for="quality">Target quality</label>
  <select id="quality">
    <option value="hd2160">2160p (4K)</option>
    <option value="hd1440">1440p (2K)</option>
    <option value="hd1080">1080p (HD)</option>
    <option value="hd720">720p (HD)</option>
    <option value="large">480p</option>
    <option value="medium">360p</option>
    <option value="small">240p</option>
    <option value="tiny">144p</option>
  </select>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
